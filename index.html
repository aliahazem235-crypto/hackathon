<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_44');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || 160;
const height = container.clientHeight || 160;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 2.7;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

// Procedural Earth canvas texture with oceans, continents, and subtle atmosphere
function createEarthTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Deep ocean gradient
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 512);
  oceanGrad.addColorStop(0, '#0a2342');
  oceanGrad.addColorStop(0.5, '#001e3d');
  oceanGrad.addColorStop(1, '#0a2342');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 1024, 512);

  // Ocean wave / depth noise
  ctx.fillStyle = 'rgba(0, 168, 255, 0.08)';
  for (let i = 0; i < 400; i++) {
    ctx.beginPath();
    ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 8 + 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw landmasses
  ctx.fillStyle = '#1e824c';
  ctx.strokeStyle = '#27ae60';
  ctx.lineWidth = 2;

  function drawContinent(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // North America
  drawContinent([[120, 90], [210, 80], [260, 120], [240, 190], [210, 240], [170, 260], [140, 210], [90, 140]]);
  // South America
  drawContinent([[220, 270], [290, 310], [270, 420], [220, 470], [190, 370], [190, 300]]);
  // Eurasia
  drawContinent([[460, 90], [600, 70], [780, 80], [860, 140], [820, 210], [680, 210], [580, 160], [480, 150]]);
  // Africa
  drawContinent([[460, 190], [560, 190], [580, 290], [530, 400], [470, 380], [430, 270]]);
  // Australia
  drawContinent([[780, 330], [870, 330], [880, 410], [800, 420], [760, 370]]);
  // Extra archipelagos & land details
  ctx.fillStyle = '#2ecc71';
  for (let j = 0; j < 50; j++) {
    ctx.beginPath();
    ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 14 + 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cloud bands
  ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
  for (let c = 0; c < 30; c++) {
    ctx.beginPath();
    const cx = Math.random() * 1024;
    const cy = Math.random() * 512;
    ctx.ellipse(cx, cy, Math.random() * 90 + 30, Math.random() * 18 + 5, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

const earthTexture = createEarthTexture();

// Earth sphere
const earthGeo = new THREE.SphereGeometry(1, 48, 48);
const earthMat = new THREE.MeshPhongMaterial({
  map: earthTexture,
  shininess: 25,
  specular: new THREE.Color(0x00d2ff),
  emissive: new THREE.Color(0x021329),
  emissiveIntensity: 0.4
});
const earth = new THREE.Mesh(earthGeo, earthMat);
earth.rotation.z = 0.41; // ~23.5 degree axial tilt
scene.add(earth);

// Atmosphere glow layer
const glowGeo = new THREE.SphereGeometry(1.04, 36, 36);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x00e5ff,
  transparent: true,
  opacity: 0.22,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide
});
const atmosphere = new THREE.Mesh(glowGeo, glowMat);
scene.add(atmosphere);

// Lighting
const ambientLight = new THREE.AmbientLight(0x336699, 1.2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
sunLight.position.set(5, 3, 4);
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x00e5ff, 1.5);
rimLight.position.set(-4, -2, -2);
scene.add(rimLight);

// Animation loop
let reqId;
function animate() {
  reqId = requestAnimationFrame(animate);
  earth.rotation.y += 0.007; // Smooth planetary rotation
  renderer.render(scene, camera);
}
animate();

// Resize observer
function onResize() {
  const w = container.clientWidth || 160;
  const h = container.clientHeight || 160;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

})();
</script>

<script data-purpose="live-clock-updater">
    // Update live clock to mirror digital smart display
    function updateClock() {
      const clockElement = document.getElementById('live-time-display');
      if (!clockElement) return;

      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // 0 hour should be 12
      const strHours = String(hours).padStart(2, '0');

      clockElement.textContent = `${strHours}:${minutes} ${ampm}`;
    }

    // Initialize and interval update
    updateClock();
    setInterval(updateClock, 1000);
  </script>
